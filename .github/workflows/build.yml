name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.3xx
      - name: Core checks
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MiNotifyWin-win-x64
          path: artifacts/releases/
